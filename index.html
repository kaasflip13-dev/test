<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceBots</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="menu">
    <h1>SPACEBOTS</h1>
    <p>THE LAST SURVIVORS</p>

    <button id="startButton">START GAME</button>
    <button id="helpButton">HELP</button>

    <div id="menuStats">
      Score: <span id="highscore">0</span>
    </div>
  </div>

  <div id="game" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div>❤️ HP: <span id="hp">100</span></div>
      <div>⭐ SCORE: <span id="score">0</span></div>
      <div>🌊 WAVE: <span id="wave">1</span></div>
    </div>

    <button id="pauseButton">Ⅱ</button>

    <div id="mobileControls">
      <div id="joystick">MOVE</div>
      <button id="fireButton">FIRE</button>
    </div>

  </div>

  <div id="gameOver" class="hidden">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>

    <button id="restartButton">OPNIEUW</button>
    <button id="menuButton">MENU</button>
  </div>

  <div id="help" class="hidden">
    <div class="helpBox">
      <h2>HOW TO PLAY</h2>

      <p>🕹️ WASD of pijltjestoetsen = bewegen</p>
      <p>🖱️ Muis = richten</p>
      <p>🖱️ Klik = schieten</p>
      <p>📱 Telefoon = joystick + FIRE</p>
      <p>🤖 Versla de robots</p>
      <p>🚫 Geen bloed</p>

      <button id="closeHelp">TERUG</button>
    </div>
  </div>

  <script src="a.js"></script>
</body>
</html>
